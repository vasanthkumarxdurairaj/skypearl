[build]
  command = "npm run build"
  publish = "dist/skypearl/browser"

[build.environment]
  NETLIFY_DRAWER = "false"
  SECRETS_SCAN_ENABLED = "false"

[context.production.environment]
  NETLIFY_DRAWER = "false"

[[redirects]]
  from = "/api/hindu-feed/*"
  to = "https://www.thehindu.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
