<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SkyPearl Realty • Chennai Property Management & CRM</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <!-- Cache Busting: Ensure browsers always fetch the latest index.html and hashed assets -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#cba86b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <!-- Google Fonts: Manrope, Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    #nl-badge-frame,
    #nl-badge-container,
    [id*="nl-badge"],
    [class*="nl-badge"],
    iframe[title*="Netlify"],
    iframe[src*="netlify"],
    iframe[id*="netlify"],
    [data-netlify-drawer],
    [class*="netlify-drawer"],
    #netlify-badge,
    .netlify-badge,
    netlify-drawer {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      left: -9999px !important;
      z-index: -9999 !important;
    }
  </style>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('skypearl_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }

      // Cache-Busting: Unregister stale service workers and old cache storages to guarantee fresh bundle load
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="light-theme">
  <app-root></app-root>
</body>

</html>
