<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SkyPearl Realty OS • Chennai Property Intelligence & CRM</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#cba86b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <!-- Google Fonts: Manrope, Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('skypearl_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>
</head>

<body class="light-theme">
  <app-root></app-root>
</body>

</html>
